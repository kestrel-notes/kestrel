<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Kestrel 应用图标的唯一源头。resources/icon.ico 与 icon-*.png 都由它生成
       （scripts/make-icon.mjs 用渲染进程的 canvas 栅格化，见 docs/视觉设计系统.md）。
       图形：悬停姿态的红隼，从正前方看——双翼上举成 V、身体竖直、长尾下垂成窄扇形。
       迎风定悬是红隼区别于其他猛禽的标志动作；眼下方两道深色的颊纹（malar stripe）
       是它区别于其他小型隼类的标志花纹。
       配色从红隼身上取：背与翼的栗红做底（brand-deep 到 brand-light 渐变），
       胸腹的奶油做剪影（brand-cream），眼、喙与颊纹用同色系深栗压一下。
       注：SVG 走 XML 解析器，注释内不能连续两个连字符，所以 CSS 变量名去前缀写。 -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A63A1F" />
      <stop offset="1" stop-color="#D97A4C" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#back)" />
  <g fill="#FBEFDF">
    <!-- 左翼：肩 (28,22)、翼尖 (10,5)、后缘落回 (23,31)。翼尖刻意画得又窄又尖，
         区别于鸽子/海鸥那种圆头翼；这是隼科的特征。 -->
    <path d="M28 22 Q19 12 10 5 Q13 20 23 31 Z" />
    <!-- 右翼（镜像） -->
    <path d="M36 22 Q45 12 54 5 Q51 20 41 31 Z" />
    <!-- 身体：圆头 + 渐细的腹部，末端接到尾羽。头刻意画得比颈宽一档，
         给脸上的眼/喙/颊纹留出可读的空间；不然 64px 下会糊成骷髅样。 -->
    <path d="M32 12 C36.5 12 37.5 16.5 37 20 C37 28 34 36 32 40 C30 36 27 28 27 20 C26.5 16.5 27.5 12 32 12 Z" />
    <!-- 尾羽：窄长微敞，末端略收。红隼的尾比一般雀形目长，比鹰类窄。 -->
    <path d="M29 39 L25 57 Q32 59 39 57 L35 39 Z" />
  </g>
  <!-- 头部细节：冠羽 + 颊纹 + 喙。眼点刻意省掉——64px 下"两个圆点 + 一个三角"
       会读成骷髅；红隼真正的脸谱是眼下方两道深色颊纹（malar stripe），
       留着颊纹和喙反而更像隼。16px 下这些细节会糊掉，但轮廓不受影响。 -->
  <g fill="#7A2411">
    <!-- 冠羽：头顶一小片深色半椭圆，对应红隼偏灰蓝/栗色的头顶 -->
    <path d="M27 15 A5 3.2 0 0 1 37 15 Z" />
    <!-- 喙：向下的小三角 -->
    <path d="M32 18.4 L31 21 L33 21 Z" />
    <!-- 颊纹（malar stripe）：眼下两侧各一道短竖纹，红隼的脸谱 -->
    <rect x="28.2" y="17.5" width="1.1" height="4" rx="0.55" />
    <rect x="34.7" y="17.5" width="1.1" height="4" rx="0.55" />
  </g>
</svg>
