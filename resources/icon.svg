<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Kestrel 应用图标的唯一源头。resources/icon.ico 与 icon-*.png 都由它生成
       （scripts/make-icon.mjs 用渲染进程的 canvas 栅格化，见 docs/视觉设计系统.md）。
       图形：一只俯冲的红隼——头喙压在左下角，两道翼面向右上方掠开拖在身后，
       飞行矢量明确指向左下。取极简「箭头鸟」路线：一笔成型、无脸部细节，
       16px 下仍读得出是一只朝左下飞的鸟。
       配色从红隼身上取：背与翼的栗红做底（brand-deep 到 brand-light 渐变），
       剪影用胸腹的奶油（brand-cream）。
       注：SVG 走 XML 解析器，注释内不能连续两个连字符。 -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A63A1F" />
      <stop offset="1" stop-color="#D97A4C" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#back)" />
  <path
    fill="#FBEFDF"
    d="M12 52 C18 40 24 26 30 14 C31 26 30 34 28 40 C34 36 44 32 54 32 C44 40 30 50 12 52 Z"
  />
</svg>
