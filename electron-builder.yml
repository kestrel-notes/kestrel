# 打包配置。`npm run dist` 产出 dist/Kestrel-<版本>-setup.exe，`npm run pack` 出解包目录
# （dist/win-unpacked/，用来在装之前先看它能不能跑）。
#
# 几个选择与工程约束直接挂钩：
#
# 1) files 只收 out/ 和 package.json，**不收 node_modules**。vite 已经把 react / tiptap /
#    codemirror 全打进渲染进程那一个 chunk 了，主进程与 preload 的产物只 import 'electron'
#    和 node 内建（node:sqlite / node:fs / node:path）——运行时一个 npm 包都不需要。
#    electron-builder 的默认 files 会把 dependencies 整包塞进 asar，白多几十 MB 且毫无用处。
# 2) buildResources 指到 resources/，这样 win.icon 与安装器图标直接吃
#    scripts/make-icon.mjs 生成的那份 icon.ico（16 到 256 共七档齐全，NSIS 的 256 档是硬要求）。
# 3) extraResources 把两份图标复制进 resourcesPath。主进程 iconPath() 在打包态是按
#    process.resourcesPath 找图标的，不复制的话打包后图标会静默退成 Electron 默认的那个。

appId: com.kestrel.app
productName: Kestrel

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

asar: true

# 打包用的 Electron 直接取 node_modules/electron/dist，不再重新下载那 158 MB 的 zip。
# 本机实测（2026-09-26）：electron-builder 自己的下载缓存里**没有** electron 的 zip
# （Cache/downloads 只剩 nsis 与 7zip），于是每一趟构建都重下一遍，这台机器约 250 KB/s
# ⇒ 一趟 11 分钟，而且 github 的直连时不时重置。
# 两边那份 electron.exe SHA-256 一致（4e069955705384d0b711bedf5611b7c0bc91ff8c84fc199879d29fc4910f9bab，
# 246,324,736 字节），所以这不是"换个包试试"，是同一份东西少绕一段网络。
# 顺带一个好处：解包目录里那颗 exe 就是 `npm run dev` 与实机探针在跑的那一颗。
# 注意别用 `npm install --ignore-scripts` 装依赖后直接打包——install-electron 没跑，
# dist/ 可能停在旧版本，而 electronVersion 是从 node_modules/electron/package.json 读的。
electronDist: node_modules/electron/dist

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.ico
  signtoolOptions:
    # 出现在安装包的"发布者"字段和 Windows「应用和功能」列表里。想换成自己的名字/组织就改这行。
    # v26 把这个键从 win 底下挪进了 signtoolOptions，写在 win 下会直接报 schema 校验失败。
    publisherName: Kestrel

nsis:
  # per-user 安装（装进 %LOCALAPPDATA%\Programs）：自用 + 开源的工具，让人点一下装完就好，
  # 不必为写进 Program Files 多弹一次 UAC。perMachine: true 会改成全机安装。
  perMachine: false
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # 安装向导用简体中文（2052）。不写的话是 en-US。
  language: 2052
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kestrel
  # 卸载时**绝不能**动 %APPDATA%\Kestrel —— 那是用户的日记库，卸个软件把日记一起删了是不可接受的。
  # electron-builder 的默认值本来就是 false，这里显式写出来是因为这个默认值一旦被谁改掉，
  # 代价是用户几年的日记。
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}